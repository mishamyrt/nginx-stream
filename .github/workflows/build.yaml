name: Build nginx stream image

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - Dockerfile
      - nginx.conf
      - stream.d/**
      - .github/workflows/build.yml

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        shell: bash
        run: |
          set -euo pipefail
          echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Resolve latest Alpine version
        id: alpine
        shell: bash
        run: |
          set -euo pipefail

          docker pull alpine:latest
          ALPINE_VERSION="$(docker run --rm alpine:latest cat /etc/alpine-release)"

          case "$ALPINE_VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "Unexpected Alpine version: $ALPINE_VERSION" >&2
              exit 1
              ;;
          esac

          echo "version=$ALPINE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved Alpine version: $ALPINE_VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=alpine-${{ steps.alpine.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=alpine-${{ steps.alpine.outputs.version }}
            org.opencontainers.image.base.name=docker.io/library/alpine:${{ steps.alpine.outputs.version }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            ALPINE_VERSION=${{ steps.alpine.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          pull: true
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
